name: Advanced Feature Validation
on:
  pull_request:
    paths:
      - 'advanced_features.py'
      - 'ingest_cfbd.py'
      - 'test_advanced_features.py'
      - 'test_ingest_cfbd.py'
      - '.github/workflows/advanced-feature-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install pandas numpy
      - name: Run offline schema and leakage tests
        run: python -m unittest discover -p 'test_*.py' -v
