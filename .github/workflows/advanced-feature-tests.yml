name: Advanced Feature Validation
on:
  pull_request:
    paths:
      - 'advanced_features.py'
      - 'app.py'
      - 'research/2026_week7_advanced_preseason_matchups.csv'
      - 'ingest_cfbd.py'
      - 'test_advanced_features.py'
      - 'test_ingest_cfbd.py'
      - 'audit_archived_2025.py'
      - 'test_audit_archived_2025.py'
      - 'enrich_v12_matchups.py'
      - 'bridge_v13_2026_pregame.py'
      - 'colab_advanced_bridge.py'
      - 'validate_2026_training_inputs.py'
      - 'test_validate_2026_training_inputs.py'
      - 'test_bridge_v13_2026_pregame.py'
      - 'test_enrich_v12_matchups.py'
      - '.github/workflows/advanced-feature-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install requirements
        run: python -m pip install pandas numpy
      - name: Run offline schema and leakage tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Check Streamlit research panel syntax
        run: python -m py_compile app.py
